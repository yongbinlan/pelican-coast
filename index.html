  <header><a class="brand" href="./" aria-label="鹈鹕海岸首页"><svg viewBox="0 0 38 38" aria-hidden="true"><path d="M6 29c2-8 5-12 12-12 1-5 2-10 7-10 4 0 5 4 4 6l7 3-10 2c0 10-8 15-20 11Z" fill="currentColor"/><circle cx="26" cy="11" r="1" fill="#f3f2e9"/></svg><span>PELICAN<span class="brand-sub">COAST CLUB</span></span></a><span class="edition">小小世界，自由骑行<span>AN INTERACTIVE LITTLE ESCAPE</span></span><button id="sound" class="icon-btn" aria-label="开启海浪环境音" aria-pressed="false" title="海浪环境音">♫</button></header>
